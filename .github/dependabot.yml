version: 2

# Atualização automática de dependências. Motivo concreto: o `npm audit` do worker
# acusa vulnerabilidades críticas cuja correção exige bump major de
# @cloudflare/vitest-pool-workers — o Dependabot abre o PR e o CI diz se quebra.
#
# Cada diretório agrupa as atualizações de patch e minor num PR só. Sem isso, cada
# merge desatualiza os demais PRs e o ciclo atualizar-esperar o CI-mergear custa
# ~12 min por dependência. Versão MAIOR continua em PR separado: exige decisão.
#
# IGNORADOS de propósito (conflito de peer dependency que derruba o `npm ci`, ou seja,
# o PR inteiro, inclusive os pacotes bons do mesmo grupo). Revisitar quando sair versão compatível:
#  - vitest / @vitest/* major 5: @cloudflare/vitest-pool-workers@0.22 ainda não suporta (ERESOLVE).
#  - @modelcontextprotocol/server: o pacote `agents` não aceita a 2.3 (ERESOLVE).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Agrupa o que quase sempre sobe junto, para não gerar 5 PRs por semana.
      dev-tooling:
        patterns: ["vitest", "@vitest/*", "@cloudflare/vitest-pool-workers", "typescript", "wrangler"]
        update-types: ["minor", "patch"]
      menores-e-patches:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@modelcontextprotocol/server"
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      menores-e-patches:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "frontend"]

  - package-ecosystem: npm
    directory: /mcp-server-niso
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      menores-e-patches:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "mcp"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["ci"]
