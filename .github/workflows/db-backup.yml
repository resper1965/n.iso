name: Backup do D1 (diário)

# Backup automático do banco de produção.
#
# Por que é um workflow e NÃO o cron do Worker (`src/manutencao.ts`): o binding
# D1 não expõe API de export — quem exporta é o `wrangler d1 export`, que é CLI.
# Um Worker só conseguiria "fazer backup" paginando tabela por tabela, o que
# quebra silenciosamente a cada tabela nova. O plano tratava purga e backup como
# um item só; são mecanismos diferentes e ficaram em lugares diferentes.
#
# O `backups/README.md` documentava o backup como ato humano ("execute você
# mesmo"). Continuava sendo verdade até aqui: não havia nada agendado.

on:
  schedule:
    # 03:40 UTC = 00:40 em Brasília. Antes do cron de manutenção do Worker
    # (04:10 UTC) de propósito: se a purga apagar algo indevidamente, o backup
    # daquele dia é anterior a ela.
    - cron: '40 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    # O `CLOUDFLARE_API_TOKEN` é environment secret de `production` — só jobs
    # que declaram o environment o enxergam.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Exportar o D1 de produção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p backups
          npx wrangler d1 export niso-db --remote --output backups/niso-backup.sql

      # "Backup verificado" é o critério de saída do item 2.4 do plano, e sem
      # este passo a palavra não significa nada: um arquivo de zero byte, ou um
      # dump que o wrangler abortou no meio, sobe como artifact igual a um bom.
      # A verificação é deliberadamente barata e específica — tamanho mínimo,
      # presença das tabelas que o produto não pode perder, e contagem de
      # CREATE TABLE compatível com o schema versionado.
      - name: Verificar o dump antes de guardar
        run: |
          arquivo=backups/niso-backup.sql
          test -s "$arquivo" || { echo "::error::dump vazio ou inexistente"; exit 1; }

          bytes=$(wc -c < "$arquivo")
          if [ "$bytes" -lt 10240 ]; then
            echo "::error::dump com apenas ${bytes} bytes — export truncado?"
            exit 1
          fi

          faltando=""
          for t in users projects compliance_controls evidence risks audit_logs; do
            grep -q "CREATE TABLE.*\b${t}\b" "$arquivo" || faltando="$faltando $t"
          done
          if [ -n "$faltando" ]; then
            echo "::error::tabelas ausentes no dump:$faltando"
            exit 1
          fi

          no_dump=$(grep -c '^CREATE TABLE' "$arquivo" || true)
          no_schema=$(grep -c '^CREATE TABLE' schema.sql || true)
          echo "tabelas no dump: $no_dump | no schema.sql: $no_schema | tamanho: ${bytes} bytes"
          if [ "$no_dump" -lt $(( no_schema / 2 )) ]; then
            echo "::error::dump tem $no_dump tabelas contra $no_schema no schema — export incompleto"
            exit 1
          fi

      - name: Guardar backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backups/niso-backup.sql
          # 30 dias: o artifact é a cópia operacional para restauração rápida.
          # Retenção longa de dump com PII é decisão de privacidade, não de CI —
          # ver a onda 6 do plano (retenção), ainda em aberto.
          retention-days: 30

      # Backup que falha em silêncio é pior que não ter backup: cria a crença de
      # que existe cópia. Mesmo padrão do `deploy.yml`, que abre issue ao falhar.
      - name: Abrir issue se o backup falhar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = 'Backup diário do D1 falhou';
            const { data: abertas } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'backup',
            });
            if (abertas.some(i => i.title === titulo)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titulo,
              labels: ['backup'],
              body: [
                `O backup automático do D1 falhou na execução ${context.runId}.`,
                '',
                `Log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Enquanto esta issue estiver aberta, considere que **não há backup recente**.',
                'Runbook: `docs/runbook-incidente.md`.',
              ].join('\n'),
            });
