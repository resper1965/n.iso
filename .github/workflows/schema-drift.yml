name: Drift de schema do D1 (semanal)

# O QUE ESTE WORKFLOW EXISTE PARA PEGAR, e como o problema apareceu.
#
# Ao construir o banco de staging a partir do `schema.sql` canônico e comparar
# os dois `sqlite_master`, produção tinha 20 objetos a mais: 12 tabelas e 8
# índices que não estão no schema versionado nem em migration nenhuma, e que o
# código de `src/` não referencia. Três guardam dado de cliente que ninguém lê.
#
# Isso não foi pego por teste porque a suíte constrói o banco a partir do
# `schema.sql` — ela vê o schema que o repositório DECLARA, nunca o que
# produção TEM. A diferença entre os dois é invisível por construção, e cresce
# em silêncio: cada `wrangler d1 execute` manual deixa rastro que só reaparece
# num incidente.
#
# Roda semanal, e não diário, porque drift não aparece de hora em hora — e um
# alerta que toca toda semana sem novidade é um alerta que ninguém lê.

on:
  schedule:
    - cron: '25 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Comparar produção com schema.sql
        id: comparar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail

          # O que produção TEM.
          npx wrangler d1 execute niso-db --remote --json -y --command \
            "SELECT type||' '||name AS obj FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name <> 'd1_migrations' ORDER BY obj;" \
            | node -e "
              let e='';process.stdin.on('data',d=>e+=d).on('end',()=>{
                const r=JSON.parse(e)[0].results.map(x=>x.obj).join('\n');
                require('fs').writeFileSync('producao.txt', r+'\n');
              });"

          # O que o repositório DECLARA. `scripts/objetos-do-schema.mjs` aplica o
          # schema.sql num SQLite em memória e lê o `sqlite_master` resultante —
          # e não por regex no arquivo, que erraria em `CREATE TABLE` dentro de
          # comentário e em índice declarado junto da tabela. O que vale é o que
          # o motor cria.
          node --experimental-sqlite scripts/objetos-do-schema.mjs > declarado.txt

          # Piso: se a extração falhar, os dois arquivos ficam vazios e a
          # comparação passaria dizendo "sem drift" sem ter olhado nada.
          if [ "$(wc -l < declarado.txt)" -lt 40 ]; then
            echo "::error::schema.sql produziu menos de 40 objetos — extração quebrada, não ausência de drift"
            exit 1
          fi
          if [ "$(wc -l < producao.txt)" -lt 40 ]; then
            echo "::error::a consulta ao D1 de produção devolveu menos de 40 objetos — extração quebrada"
            exit 1
          fi

          grep -v '^#' docs/drift-schema-conhecido.txt | grep -v '^\s*$' | sed 's/^[[:space:]]*//' | sort > conhecido.txt
          comm -23 producao.txt declarado.txt > drift-atual.txt
          comm -23 drift-atual.txt conhecido.txt > drift-novo.txt

          echo "conhecido: $(wc -l < conhecido.txt) | drift atual: $(wc -l < drift-atual.txt) | NOVO: $(wc -l < drift-novo.txt)"
          cat drift-novo.txt

          {
            echo 'novo<<FIM'
            cat drift-novo.txt
            echo FIM
          } >> "$GITHUB_OUTPUT"

          # Drift que SUMIU também interessa: objeto removido de produção sem
          # sair de `docs/drift-schema-conhecido.txt` deixa a lista mentindo.
          comm -13 drift-atual.txt conhecido.txt > drift-sumiu.txt
          {
            echo 'sumiu<<FIM'
            cat drift-sumiu.txt
            echo FIM
          } >> "$GITHUB_OUTPUT"

          test ! -s drift-novo.txt

      - name: Abrir ou atualizar issue de drift
        if: failure() && steps.comparar.outputs.novo != ''
        uses: actions/github-script@v7
        env:
          NOVO: ${{ steps.comparar.outputs.novo }}
          SUMIU: ${{ steps.comparar.outputs.sumiu }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'O D1 de produção tem objeto que o `schema.sql` não declara e que não está na lista conhecida.',
              '',
              '**Novo:**',
              '```',
              (process.env.NOVO || '(nenhum)').trim(),
              '```',
              '',
              '**Sumiu de produção mas continua na lista conhecida:**',
              '```',
              (process.env.SUMIU || '(nenhum)').trim(),
              '```',
              '',
              'Objeto criado à mão em produção nunca chega ao teste: a suíte constrói o banco',
              'a partir do `schema.sql`, então ela vê o que o repositório declara, nunca o que',
              'produção tem.',
              '',
              'Encaminhamento: se o objeto é legítimo, escreva a migration e ponha no `schema.sql`.',
              'Se é resto de implementação antiga, registre em `docs/drift-schema-conhecido.txt`',
              '— e trate descarte de dado como decisão de retenção, com backup na mão, nunca',
              'como faxina de CI.',
              '',
              `Run: ${run}`,
            ].join('\n');
            const abertas = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'schema-drift' });
            if (abertas.data.length) {
              await github.rest.issues.update({ owner, repo, issue_number: abertas.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Drift de schema no D1 de produção', body, labels: ['schema-drift'] });
            }
