name: CI

on:
  push:
    branches: [main]
  # Sem filtro de branch: `branches: [main]` casa com a BASE do PR, então PR
  # empilhado sobre outro branch não rodava job nenhum — e "0 checks" se parece
  # com "ainda não começou", não com "não vai rodar". Aconteceu no PR #14.
  pull_request:

# O CI só lê o repositório. Sem isso, o GITHUB_TOKEN vem com escrita por padrão.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: Build Frontend
        run: cd frontend && npm ci && npm run build
      - name: Test Frontend
        run: cd frontend && npm test
      - name: Build MCP Server
        run: cd mcp-server-niso && npm ci && npm run build
      # Retry GATEADO POR ASSINATURA: só re-tenta se a falha casar a flakiness
      # conhecida do @cloudflare/vitest-pool-workers no teardown
      # (`fetch failed / other side closed`, erro do runtime, não do app).
      # Qualquer outra falha — inclusive regressão intermitente do app — propaga
      # imediatamente, para o retry não pintar um bug real de verde.
      - name: Run Tests
        run: |
          set -o pipefail
          run() { npm test -- --run 2>&1 | tee /tmp/niso-test.log; }
          if run; then exit 0; fi
          if grep -qE "other side closed|fetch failed" /tmp/niso-test.log; then
            echo "::warning::Falha casa a flakiness conhecida do pool no teardown; repetindo UMA vez."
            run && exit 0
          fi
          echo "::error::Falha de teste NÃO é a flakiness conhecida — não re-tento."
          exit 1
