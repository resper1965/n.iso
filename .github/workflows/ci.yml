name: CI

on:
  push:
    branches: [main]
  # Sem filtro de branch: `branches: [main]` casa com a BASE do PR, então PR
  # empilhado sobre outro branch não rodava job nenhum — e "0 checks" se parece
  # com "ainda não começou", não com "não vai rodar". Aconteceu no PR #14.
  pull_request:

# O CI só lê o repositório. Sem isso, o GITHUB_TOKEN vem com escrita por padrão.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: Build Frontend
        run: cd frontend && npm ci && npm run build
      # Coverage + piso de catraca (frontend/vitest.config.js): falha se a
      # cobertura do frontend regredir abaixo do minimo. Gera junit + html + lcov.
      - name: Test Frontend (coverage)
        run: cd frontend && npm run test:coverage
      - name: Build MCP Server
        run: cd mcp-server-niso && npm ci && npm run build
      # Roda com cobertura (istanbul) + piso de catraca do worker.
      # Sem retry: a flakiness de teardown (`fetch failed / other side closed`)
      # era do pool 0.4.x; no 0.20 (pool reescrito) não reproduz. Se voltar a
      # aparecer, re-adicionar o retry gateado por assinatura — um flake é
      # não-destrutivo (basta re-rodar).
      - name: Run Tests
        run: npm run test:coverage

      # Publica os relatorios (junit dos dois suites + cobertura html/lcov do
      # frontend) como artefato do run. `always()` para sair MESMO em falha —
      # e justamente quando falha que se quer o detalhe.
      - name: Upload relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results/**
            coverage/**
            frontend/test-results/**
            frontend/coverage/**
          if-no-files-found: ignore
          retention-days: 14
