name: CodeQL

# Análise estática de segurança. O produto processa PII sob LGPD e roda
# multi-tenant — injeção e caminho de autorização quebrado são os riscos que
# importam aqui, e são exatamente o que o CodeQL enxerga sem executar nada.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Segunda 06:00 UTC — pega regra nova do CodeQL em código que não mudou.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
